# Allowlist egress proxy.
# Default = DENY. Only the destinations needed for development are reachable.
# This is the single control that lets the agent build/install/commit while
# making exfiltration of sensitive data (e.g. from target/) impossible.

http_port 3128

# --- Allowlisted destinations ---------------------------------------------
# Squid 5: a leading dot means "this domain and all subdomains" — never mix
# an explicit hostname with its own wildcard in the same ACL line.
# Java / Maven
acl allowed dstdomain .maven.org .apache.org
# Source control (github.com is covered by .github.com)
acl allowed dstdomain .github.com .githubusercontent.com
# OS packages
acl allowed dstdomain .debian.org .ubuntu.com
# Agent tooling
acl allowed dstdomain pypi.org files.pythonhosted.org
acl allowed dstdomain .npmjs.org
# Remote model endpoint(s) — add YOUR sovereign/EU inference host here:
# acl allowed dstdomain inference.your-eu-cloud.example

# --- Safety rails ----------------------------------------------------------
acl SSL_ports port 443
acl CONNECT method CONNECT
# Only allow HTTPS tunnels to allowlisted hosts.
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

# Don't leak proxy/host details downstream.
via off
forwarded_for delete
httpd_suppress_version_string on
