# Secrets are injected from the environment at RUNTIME, never hard-coded.
# Result: target/classes/application.properties contains only placeholders,
# so even a leaked build artifact carries no credentials.
spring.application.name=citizen-demo
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:mem:demo}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
